<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openfreemap.org; font-src 'self'; connect-src 'self' https://*.openfreemap.org https://photon.komoot.io https://router.project-osrm.org; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Įkrovimo kainos">
<meta name="format-detection" content="telephone=no">
<title>Įkrovimo kainos – EV charging prices in Lithuania</title>
<meta name="description" content="Compare electric car charging prices across Lithuania and find the cheapest charger near you.">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css?lib=5.24.1">
<link rel="stylesheet" href="style.css?v=202611270831">
</head>
<body>
<div id="map" aria-label="Map"></div>

<header class="top" id="topbar">
  <div class="route" id="route">
    <button class="route-bar" id="routeBar" type="button">
      <span class="rb-ic"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zM16 16l5 5"/></svg></span>
      <span class="rb-txt" id="routeTxt"></span>
    </button>
    <button class="route-x" id="routeClear" type="button" aria-label="Clear route" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="route-form" id="routeForm" hidden>
      <div class="rf-fields">
        <label class="rf-row"><span class="rf-dot from" aria-hidden="true"></span><input id="rFrom" type="text" maxlength="120" autocomplete="off" enterkeyhint="next"></label>
        <label class="rf-row"><span class="rf-dot to" aria-hidden="true"></span><input id="rTo" type="text" maxlength="120" autocomplete="off" enterkeyhint="search"></label>
        <span class="rf-line" aria-hidden="true"></span>
      </div>
      <button class="route-x inside" id="routeClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="suggest" id="rSuggest" role="listbox"></div>
    </div>
  </div>
</header>

<button class="fab" id="locBtn" aria-label="My location"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z" fill="currentColor"/></svg></button>

<section class="panel" id="panel">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Drag to resize"><span></span></div>
  <div id="home">
    <div class="actions">
      <button class="go" id="bestBtn" data-t="bestCharge"></button>
    </div>
    <div class="row filters">
      <div class="seg" id="fastSeg" role="radiogroup" aria-label="Chargers"></div>
      <button class="chip" id="unkChip" data-t="hideUnknown"></button>
    </div>
    <div class="row">
      <label class="lbl" data-t="howMuch"></label>
      <div class="seg grow" id="kwhSeg" role="radiogroup" aria-label="kWh"></div>
      <select id="kwh" class="sr-only" tabindex="-1" aria-hidden="true">
        <option value="20">20 kWh</option>
        <option value="40" selected>40 kWh</option>
        <option value="60">60 kWh</option>
      </select>
    </div>
    <div id="results"></div>
    <div class="legend">
      <span><i class="c-free"></i><span data-t="free"></span></span>
      <span><i class="c-cheap"></i><span data-t="cheap"></span></span>
      <span><i class="c-mid"></i><span data-t="average"></span></span>
      <span><i class="c-high"></i><span data-t="expensive"></span></span>
      <span><i class="c-unk"></i><span data-t="noPrice"></span></span>
    </div>
    <div class="sheet-foot">
      <div class="statline" id="statcard" hidden>
        <span class="pulse-dot" aria-hidden="true"></span>
        <span><b id="statN"></b> <span id="statLbl"></span></span>
        <span class="stat-age" id="statAge"></span>
      </div>
    </div>
    <div class="updated" id="updated"></div>
  </div>
  <div id="detail" hidden></div>
</section>

<section class="page" id="accountPage" hidden aria-labelledby="acctTitle">
  <h1 id="acctTitle" data-t="tabAccount"></h1>
  <div class="acct-card">
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.3-8 5.2V21h16v-1.8c0-2.9-3.6-5.2-8-5.2z"/></svg></div>
    <div class="acct-who"><b id="acctHead" data-t="acctGuest"></b><span id="acctSub" data-t="acctWhy"></span></div>
    <div class="acct-btns" id="acctBtns">
      <button class="go" id="loginBtn" data-t="logIn"></button>
      <button class="secondary" id="signupBtn" data-t="signUp"></button>
    </div>
  </div>
  <div class="list">
    <button class="li" id="liCar"><span class="li-ic"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 11 6.6 6.6A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.6L19 11a2 2 0 0 1 2 2v4h-2v1.5a1.5 1.5 0 0 1-3 0V17H8v1.5a1.5 1.5 0 0 1-3 0V17H3v-4a2 2 0 0 1 2-2zm2.1 0h9.8l-1.2-3.6a.5.5 0 0 0-.5-.4H8.8a.5.5 0 0 0-.5.4zM6.5 15a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zm11 0a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg></span><span class="li-t" data-t="vehicle"></span><span class="li-v" id="liCarVal"></span><svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg></button>
    <button class="li" id="liSettings"><span class="li-ic"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></span><span class="li-t" data-t="settings"></span><span class="li-v"></span><svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg></button>
    <button class="li" id="liWallet"><span class="li-ic"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 6.5A2.5 2.5 0 0 1 6.5 4H17v3h1.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-12A2.5 2.5 0 0 1 4 17.5zM6.5 6a.5.5 0 0 0 0 1H15V6zM17 12.5a1.5 1.5 0 1 0 0 3h2v-3z"/></svg></span><span class="li-t" data-t="wallet"></span><span class="li-v" id="liWalletVal"></span><svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg></button>
  </div>
  <p class="page-foot" id="acctFoot"></p>
</section>

<nav class="tabbar" id="tabbar" aria-label="Sections"><div class="tabs" id="tabs" role="tablist"></div></nav>

<div class="modal" id="walletModal" hidden>
  <div class="sheet wallet">
    <h3 data-t="wallet"></h3>
    <div class="w-card" aria-hidden="true">
      <span class="w-chip"></span>
      <span class="w-num">•••• •••• •••• ••••</span>
      <span class="w-none" data-t="noCardAdded"></span>
    </div>
    <button class="go" id="addCardBtn"><span aria-hidden="true">+ </span><span data-t="addCard"></span></button>
    <p class="note w-why" data-t="cardWhy"></p>
    <ul class="w-promise"><li data-t="promiseCancel"></li><li data-t="promiseTrial"></li></ul>
    <div class="w-sub">
      <div><b data-t="subTitle"></b><span data-t="noSub"></span></div>
      <span class="w-tag" data-t="soonTag"></span>
    </div>
    <button class="secondary" id="walletClose" data-t="close"></button>
  </div>
</div>

<div class="modal" id="navModal" hidden>
  <div class="sheet">
    <h3 data-t="navigateWith"></h3>
    <a class="navopt" id="navGoogle" target="_blank" rel="noopener">Google Maps</a>
    <a class="navopt" id="navWaze" target="_blank" rel="noopener">Waze</a>
    <a class="navopt" id="navApple" target="_blank" rel="noopener">Apple Maps</a>
    <button class="secondary" id="navCancel" data-t="cancel"></button>
  </div>
</div>

<div class="modal" id="carModal" hidden>
  <div class="sheet">
    <div id="acctBox" hidden>
      <h3 data-t="accountSection"></h3>
      <div class="rowline"><span class="note" id="acctName"></span><button class="linkbtn" id="signOut" data-t="signOut"></button></div>
    </div>
    <h3 data-t="settings"></h3>
    <div class="rowline"><span data-t="langLbl"></span><button class="secondary small" id="langBtn" aria-label="Language">EN</button></div>
    <h3 data-t="homeTitle" style="margin-top:12px"></h3>
    <div class="note" id="homeStatus"></div>
    <div class="btnrow">
      <button class="secondary" id="homeHere" data-t="homeUseLoc"></button>
      <button class="secondary" id="homeCentre" data-t="homeUseCentre"></button>
    </div>
    <button class="linkbtn" id="homeClear" data-t="homeClear"></button>
    <h3 data-t="carTitle" style="margin-top:12px"></h3>
    <div class="note" data-t="carHint"></div>
    <label class="field"><span data-t="consLbl"></span><input type="number" id="cons" min="10" max="35" step="0.5" inputmode="decimal"><em>kWh/100 km</em></label>
    <label class="field"><span data-t="wearLbl"></span><input type="number" id="wear" min="0" max="0.5" step="0.01" inputmode="decimal"><em>€/km</em></label>
    <label class="field"><span data-t="timeLbl"></span><input type="number" id="timeVal" min="0" max="100" step="1" inputmode="decimal"><em>€/h</em></label>
    <button class="go" id="carSave" data-t="saveBtn"></button>
    <button class="linkbtn" id="infoBtn" data-t="aboutBtn"></button>
    <div class="legal-links" id="setLegal"></div>
    <button class="del-data" id="deleteData" data-t="deleteData"></button>
  </div>
</div>

<div class="onboard" id="onboard" hidden>
  <div class="ob-card">
    <div class="ob-head">
      <span class="logo big"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z" fill="currentColor"/></svg></span>
      <h2 data-t="obTitle"></h2>
      <p class="note" data-t="obSub"></p>
    </div>
    <div id="obAuth" hidden>
      <button class="authbtn" id="authGoogle" data-t="google"></button>
      <button class="authbtn" id="authApple" data-t="apple"></button>
      <div class="or"><span data-t="or"></span></div>
    </div>
    <h3 data-t="carQ"></h3>
    <p class="note" data-t="carWhy"></p>
    <input id="carSearch" type="search" maxlength="60" autocomplete="off" aria-label="Car">
    <div id="carList" class="carlist" role="list"></div>
    <button class="secondary" id="carSkip" data-t="skip"></button>
    <p class="ob-legal" id="obLegal"></p>
  </div>
</div>

<div class="modal" id="infoModal" hidden>
  <div class="sheet info" id="infoBody"></div>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span class="t-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z" fill="currentColor"/></svg></span>
  <span class="t-tx"><b id="toastT"></b><span id="toastS" hidden></span></span>
</div>

<script src="vendor/maplibre-gl.js?lib=5.24.1"></script>
<script src="i18n.js?v=202611270831"></script>
<script src="app.js?v=202611270831"></script>
</body>
</html>
