name: Update charging data

# Downloads Via Lietuva's open charging data every 30 minutes and
# commits data/lt.json when prices or stations have changed.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pinned to exact commits so a moved tag can never run other code with write access
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build data/lt.json
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          # publication time changes on every download, so compare everything except it
          if git diff --quiet -- data/lt.json; then echo "No change"; exit 0; fi
          if ! python scripts/data_changed.py; then
            echo "Only the timestamp changed"; git checkout -- data/lt.json; exit 0
          fi
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/lt.json
          git commit -m "Update charging data"
          git push
