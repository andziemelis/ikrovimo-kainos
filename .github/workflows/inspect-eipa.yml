name: Inspect Polish data (one-off)

# Runs once when this file or the script changes, to learn the structure of the EIPA files.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eipa.yml"
      - "scripts/eipa_inspect.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Describe the EIPA files
        env:
          EIPA_OPERATORS: ${{ secrets.EIPA_OPERATORS }}
          EIPA_POOLS: ${{ secrets.EIPA_POOLS }}
          EIPA_STATIONS: ${{ secrets.EIPA_STATIONS }}
          EIPA_POINTS: ${{ secrets.EIPA_POINTS }}
          EIPA_DICTIONARIES: ${{ secrets.EIPA_DICTIONARIES }}
          EIPA_DYNAMIC: ${{ secrets.EIPA_DYNAMIC }}
        run: python scripts/eipa_inspect.py
      - name: Save the description
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/pl-schema.txt data/pl-dictionaries.json 2>/dev/null || git add data/pl-schema.txt
          git commit -m "Describe Polish EIPA data structure" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
